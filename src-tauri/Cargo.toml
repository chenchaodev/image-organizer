[package]
name = "image-organizer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "image_organizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 为什么 dev 依赖也开优化：image/libheif 解码在 debug 下慢 ~40 倍（image-rs issue #1424），
# `npm run tauri dev` 实测 12MP JPEG 解码 10s+，缩略图/详情体验不可用；
# 只优化依赖（解码热点在依赖内），自身代码保持 debug 快速迭代。
[profile.dev.package."*"]
opt-level = 2

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-dialog = "2"
walkdir = "2.5.0"
# 为什么关默认特性：image 默认拉入 avif/exr/hdr 等解码器（含 rav1e 重型依赖），
# 而本产品扩展名白名单只覆盖 png/jpeg/gif/webp/bmp/tiff，按需开启即可（CODE-GUIDE：新依赖先评估）。
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6.1"
# 为什么加 libheif-rs：heic/heif 是白名单扩展名（scanner::IMAGE_EXTENSIONS），
# 但 image crate 不含 HEIC 解码器；libheif-rs 通过 vcpkg 链接系统 libheif，
# Windows 下需 VCPKG_ROOT 环境变量指向 vcpkg 安装目录。
libheif-rs = "2.7.0"

